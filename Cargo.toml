[workspace]
resolver = "2"
members = ["crates/*"]
# vendor/ may hold a local Rune clone for reading; it isn't part of this workspace.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.9.0"

[workspace.dependencies]
filewinch-core = { path = "crates/filewinch-core" }
filewinch-local = { path = "crates/filewinch-local" }
filewinch-store = { path = "crates/filewinch-store" }
filewinch-os = { path = "crates/filewinch-os" }
# Rune, pinned to a `dev` revision ("Pin a rev of `dev`; `dev` is never rewritten").
# To update: pick the new rev, check Rune's root Cargo.toml `[patch.crates-io]` at that rev, and
# use the same rev here and for every patch below.
rune = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee", default-features = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cargo doesn't inherit a dependency's patches: these mirror Rune's own `[patch.crates-io]` at the
# same rev (crates/rune/README.md, "Depending on Rune"). Without them VoiceOver/Narrator miss
# Rune's headings, and winit and sctk-adwaita must come from the same rev or Wayland won't build.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
winit = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "762ab46d3c51b167aff0d52fe556881549ac2cee" }

# Rune's advice: full debug info for its crates costs many GB; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
