<!doctype html><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#888}iframe{border:0;display:block;background:#fff}</style>
<iframe id="f"></iframe>
<script>
  var q = new URLSearchParams(location.search), f = document.getElementById("f");

</script>
