[package]
name = "filewinch-cloud"
description = "Filewinch's cloud drives (Google Drive, Dropbox, OneDrive, Box) over OAuth 2 with PKCE."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
filewinch-core = { workspace = true }
filewinch-os = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
httpdate = "1"
percent-encoding = "2"

[dev-dependencies]
filewinch-engine = { path = "../filewinch-engine" }
tiny_http = "0.12"

