[package]
name = "filewinch-os"
description = "Filewinch's per-OS glue: where files live, Windows file-name rules, and opening URLs, files and editors."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
