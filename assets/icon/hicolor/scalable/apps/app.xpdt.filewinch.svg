<svg xmlns="http://www.w3.org/2000/svg" width="944" height="944" viewBox="40 40 944 944">
  <!-- Filewinch app icon (master). Original artwork: a winch drum seen end-on, cable wound on it,
       the outer wrap paying out into a down arrow. Colours: Filewinch teal accent #3fb6a8 / #0d7f78. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#0d7f78"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b6a64"/>
      <stop offset="1" stop-color="#074b47"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#03302d" flood-opacity="0.40"/>
    </filter>
  </defs>
  <!-- squircle tile on the macOS 824 px grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <!-- drum: dark barrel inside a white flange -->
  <circle cx="474" cy="420" r="260" fill="url(#drum)" stroke="#ffffff" stroke-width="18" filter="url(#soft)"/>
  <g filter="url(#soft)" fill="#ffffff">
    <!-- wound cable: inner wrap, and the outer wrap that leaves the drum as the free cable -->
    <circle cx="474" cy="420" r="122" fill="none" stroke="#ffffff" stroke-width="42"/>
    <path d="M666 420 A192 192 0 1 0 474 612 M666 420 L666 720" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="butt"/>
    <path d="M474 612 A192 192 0 0 0 666 420" fill="none" stroke="#ffffff" stroke-width="42"/>
    <!-- arrow head -->
    <path d="M544 710 H788 L666 846 Z" stroke="#ffffff" stroke-width="30" stroke-linejoin="round"/>
    <!-- axle -->
    <circle cx="474" cy="420" r="40"/>
  </g>
</svg>
