<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Filewinch app icon, simplified variant for 16 and 32 px (16@2x, 32@1x).
       Same motif as icon.svg (winch drum, cable paying out into a down arrow) with one bold wrap,
       no shadows, and edges on the 16 px grid (64 units = 1 px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6a8"/>
      <stop offset="1" stop-color="#0d7f78"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- drum: dark barrel, one thick white wrap -->
  <circle cx="448" cy="416" r="208" fill="#074b47" stroke="#ffffff" stroke-width="96"/>
  <!-- axle -->
  <circle cx="448" cy="416" r="64" fill="#ffffff"/>
  <!-- free cable and arrow head -->
  <rect x="608" y="416" width="96" height="256" fill="#ffffff"/>
  <path d="M448 640 H864 L656 896 Z" fill="#ffffff"/>
</svg>
