<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Filewinch disk image window background (600x400 points). Icons sit at (150,190) and
       (450,190), 128 pt; scripts/release-mac.sh places them. Rendered by render-dmg-background.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eceef2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g fill="none" stroke="#9aa1ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 190 H340"/>
    <path d="M326 176 L344 190 L326 204"/>
  </g>
  <text x="300" y="330" text-anchor="middle" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" fill="#5b6270">Drag Filewinch to Applications to install it</text>
</svg>
