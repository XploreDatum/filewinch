# Shared setup for CI and release jobs: the Rust toolchain from rust-toolchain.toml, Rune's Linux
# build packages, a Cargo cache, and (for tests) rclone, which filewinch-testkit runs as local
# SFTP/FTP/WebDAV/S3 servers.
name: Set up the Filewinch build
description: Toolchain from rust-toolchain.toml, Linux packages, Cargo cache, optional rclone.
inputs:
  targets:
    description: Extra rustup targets to install (space-separated).
    default: ""
  rclone:
    description: Install rclone for the tests ("true" or "false").
    default: "false"
  cache-key:
    description: Extra Cargo cache key (e.g. the job's purpose), so test and release builds keep separate caches.
    default: ""
runs:
  using: composite
  steps:
    - name: Rust toolchain (rust-toolchain.toml)
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        # With no arguments rustup installs the toolchain and components the file names.
        rustup toolchain install
        for t in $TARGETS; do rustup target add "$t"; done
        rustc --version && cargo --version

    - name: Linux packages (Rune's build and headless-render needs)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Build: libxkbcommon-dev, libwayland-dev (vendor Rune README "Linux").
        # Headless tests: libxkbcommon-x11-0 and a software Vulkan driver (lavapipe), since the
        # runners have no GPU.
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

    - name: Cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}

    - name: rclone (test servers)
      if: inputs.rclone == 'true'
      shell: bash
      run: |
        # Pinned version and checksums (from https://downloads.rclone.org/v1.73.0/SHA256SUMS).
        v=v1.73.0
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   f=rclone-$v-linux-amd64;   sum=2a69bf23b6e937b03f4b6f71e97154543d81610b2e5d209e9a2b96b1f9c2d803 ;;
          Linux-ARM64) f=rclone-$v-linux-arm64;   sum=4e361cc6a5bd29ce157bb60f3d4579d8b323c8c0e3643f226549cf0c050a5fa5 ;;
          macOS-ARM64) f=rclone-$v-osx-arm64;     sum=9efe8f1c147be5150950956a087e44670407bbab1c71df9d7dc4e23d69a77e3e ;;
          Windows-X64) f=rclone-$v-windows-amd64; sum=14e1c40f34ec18532e832c228231338bd182817af6f6529a402474c69acabe0b ;;
          *) echo "::error::no pinned rclone for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/rclone"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$f.zip" "https://downloads.rclone.org/$v/$f.zip"
        if command -v sha256sum >/dev/null; then check="sha256sum -c -"; else check="shasum -a 256 -c -"; fi
        (cd "$dir" && echo "$sum  $f.zip" | $check)
        unzip -q -o "$dir/$f.zip" -d "$dir"
        echo "$dir/$f" >> "$GITHUB_PATH"
        "$dir/$f/rclone" version | head -1
