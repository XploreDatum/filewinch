name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          rclone: "true"
          cache-key: ci

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build tests
        run: cargo test --workspace --locked --no-run

      # Linux: log memory and disk every 30 s, and stop any single process that passes 6 GB,
      # naming it, so a runaway test fails the step instead of starving the runner (which
      # loses the whole log).
      - name: resource guard (Linux)
        if: runner.os == 'Linux'
        run: |
          nohup bash -c 'while true; do
            echo "$(date -u +%T) $(free -m | awk "/Mem/{print \"mem \" \$3 \"/\" \$2 \" MB\"}") $(df -h / | awk "NR==2{print \"disk free \" \$4}")"
            ps -eo pid,rss,args --sort=-rss | awk "NR>1 && \$2 > 6000000 {print}" | while read -r pid rss args; do
              echo "KILLED (rss ${rss} KB): ${args}"; kill -9 "$pid"; done
            sleep 30; done' > "$RUNNER_TEMP/resources.log" 2>&1 &

      - name: test
        timeout-minutes: 30
        run: cargo test --workspace --locked --no-fail-fast

      - name: resource log (Linux)
        if: always() && runner.os == 'Linux'
        run: tail -n 120 "$RUNNER_TEMP/resources.log" || true
